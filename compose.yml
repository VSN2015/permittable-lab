x-lab-app: &lab-app
  image: permittable-lab/ruby:3.3
  build:
    context: docker
  working_dir: /app
  environment:
    PERMITTABLE_SOURCE: ${PERMITTABLE_SOURCE:-local}
    PERMITTABLE_VERSION: ${PERMITTABLE_VERSION:-}
    DB_HOST: db
    DB_USER: lab
    DB_PASSWORD: lab
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d postgres"]
      interval: 2s
      retries: 30

  rails-8_1:
    <<: *lab-app
    command: sh -c "bin/rails db:create db:migrate db:seed && bin/rails server -b 0.0.0.0 -p 3081"
    ports:
      - "3081:3081"
    volumes:
      - ./apps/rails-8_1:/app
      - ./shared:/app/shared
      - ./docs:/app/docs:ro
      - bundle-8_1:/bundle
      - &permittable-gem
        type: bind
        source: ${PERMITTABLE_PATH:-${HOME}/Projects/individual-projects/permittable}
        target: /permittable
        read_only: true
        bind:
          create_host_path: false

volumes:
  pgdata:
  bundle-8_1:
    name: permittable-lab_bundle-8_1
