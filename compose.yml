x-lab-env: &lab-env
  PERMITTABLE_SOURCE: ${PERMITTABLE_SOURCE:-local}
  PERMITTABLE_VERSION: ${PERMITTABLE_VERSION:-}
  DB_HOST: db
  DB_USER: lab
  DB_PASSWORD: lab

x-lab-app: &lab-app
  image: permittable-lab/ruby:3.3
  build:
    context: docker
  working_dir: /app
  environment: *lab-env
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d postgres"]
      interval: 2s
      retries: 30

  rails-8_1:
    <<: *lab-app
    environment:
      <<: *lab-env
      LAB_RAILS: "8.1"
    command: sh -c "bin/rails db:create db:migrate db:seed && bin/rails server -b 0.0.0.0 -p 3081"
    ports:
      - "3081:3081"
    volumes:
      - ./apps/rails-8_1:/app
      - ./shared:/app/shared
      - ./docs:/app/docs:ro
      - bundle-8_1:/bundle
      - &permittable-gem
        type: bind
        source: ${PERMITTABLE_PATH:-${HOME}/Projects/individual-projects/permittable}
        target: /permittable
        read_only: true
        bind:
          create_host_path: false

  rails-7_2:
    <<: *lab-app
    environment:
      <<: *lab-env
      LAB_RAILS: "7.2"
    command: sh -c "bin/rails db:create db:migrate db:seed && bin/rails server -b 0.0.0.0 -p 3072"
    ports:
      - "3072:3072"
    volumes:
      - ./apps/rails-7_2:/app
      - ./shared:/app/shared
      - ./docs:/app/docs:ro
      - bundle-7_2:/bundle
      - *permittable-gem

  rails-8_0:
    <<: *lab-app
    environment:
      <<: *lab-env
      LAB_RAILS: "8.0"
    command: sh -c "bin/rails db:create db:migrate db:seed && bin/rails server -b 0.0.0.0 -p 3080"
    ports:
      - "3080:3080"
    volumes:
      - ./apps/rails-8_0:/app
      - ./shared:/app/shared
      - ./docs:/app/docs:ro
      - bundle-8_0:/bundle
      - *permittable-gem

volumes:
  pgdata:
  bundle-8_1:
    name: permittable-lab_bundle-8_1
  bundle-7_2:
    name: permittable-lab_bundle-7_2
  bundle-8_0:
    name: permittable-lab_bundle-8_0
